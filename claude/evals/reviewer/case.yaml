schema_version: '1'
name: reviewer
description: 'A risky change goes to the core:reviewer agent, which finds the planted pricing bug.'
context:
  add_dirs: [fixture]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Agent]
  prompt: 'The project is in the extra working directory you were given (the folder named "fixture"). I changed how checkout discounts are calculated in `src/discount.ts` (new file, not committed yet). It touches money, so review it against `docs/spec.md` before I open a PR. Do not edit anything.'
graders:
  - type: tool_used
    name: reviewer-used
    tool: Agent
    input_match: 'reviewer'
  - type: llm
    name: finds-bug
    criteria: 'The review reports that an order of exactly 100 gets no discount although the spec gives 10% from 100 (the `>` should be `>=`), and that a negative total is not rejected. It ends with a verdict that the change is not ready as is.'
