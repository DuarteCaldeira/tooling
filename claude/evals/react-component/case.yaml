schema_version: '1'
name: react-component
description: 'The core:react-conventions skill triggers and its rules show up in the answer.'
context:
  add_dirs: [fixture]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'The project is in the extra working directory you were given (the folder named "fixture"). Plan a new reusable `UserCard` component that shows an avatar and a name. List the files you would create and how you would test it. Do not write the code.'
graders:
  - type: tool_used
    name: skill-loaded
    tool: Skill
    input_match: 'react-conventions'
  - type: llm
    name: follows-conventions
    criteria: 'The answer puts the component in its own folder (`UserCard/UserCard.tsx`, `UserCard.module.scss`, `UserCard.test.tsx`, `index.ts`), uses an SCSS Module with BEM naming, and tests behaviour with Testing Library queries by role or text.'
