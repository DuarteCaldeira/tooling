schema_version: '1'
name: supabase-migration
description: 'The core:backend-conventions skill triggers and its rules show up in the answer.'
context:
  add_dirs: [fixture]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'The project is in the extra working directory you were given (the folder named "fixture"). I need to rename the column `weight` to `weight_kg` on the `sessions` table. Describe how you would do it safely. Do not write files.'
graders:
  - type: tool_used
    name: skill-loaded
    tool: Skill
    input_match: 'backend-conventions'
  - type: llm
    name: follows-conventions
    criteria: 'The answer adds a new append-only migration (does not edit an applied one), treats the rename as breaking for consumers, checks RLS policies and dependent queries/functions, and updates every consumer in the same change or stages the rollout.'
