schema_version: '1'
name: adopt
description: 'The core:adopt-repo skill triggers and its rules show up in the answer.'
context:
  add_dirs: [fixture]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'The project is in the extra working directory you were given (the folder named "fixture"). Bring this repository in line with our shared repo standard for the core plugin. Start by telling me what you would change; do not edit anything yet.'
graders:
  - type: tool_used
    name: skill-loaded
    tool: Skill
    input_match: 'adopt-repo'
  - type: llm
    name: follows-conventions
    criteria: 'The answer audits against the standard: AGENTS.md shape (Repository, Layout, Commands, Constraints), CLAUDE.md reduced to `@AGENTS.md`, a committed .claude/settings.json enabling core@dcaldeira, removing the .ai reference and ai-memory/ after salvaging useful content, and verifying with tooling doctor.'
