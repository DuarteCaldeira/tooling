name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Release PR to route after trusted generation
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pull-request-number || github.ref }}
  cancel-in-progress: true
jobs:
  CI:
    uses: DuarteCaldeira/repo-tooling/.github/workflows/ci.yml@REPLACE_WITH_TOOLING_COMMIT_SHA
    with:
      tooling-sha: REPLACE_WITH_TOOLING_COMMIT_SHA
      pull-request-number: ${{ inputs.pull-request-number || '' }}
