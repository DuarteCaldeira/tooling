name: Reusable CI
on:
  workflow_call:
    inputs:
      tooling-sha:
        type: string
        required: true
      config-path:
        type: string
        default: tooling.config.json
      lightweight-docs:
        type: boolean
        default: false
      pull-request-number:
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.route.outputs.trusted }}
      ref: ${{ steps.route.outputs.ref }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DuarteCaldeira/tooling
          ref: ${{ inputs.tooling-sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/github-script@v7
        id: route
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
          CONFIG_PATH: ${{ inputs.config-path }}
          PUBLIC_KEY: ${{ vars.TOOLING_RELEASE_PUBLIC_KEY }}
        with:
          script: |
            const { verifyPullRequest } = await import(`${process.cwd()}/tooling/packages/tooling/release/github.mjs`);
            const { version } = require(`${process.cwd()}/tooling/packages/tooling/package.json`);
            const { owner, repo } = context.repo;
            const number = process.env.PR_NUMBER;
            let trusted = false;
            if (number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(number) });
              core.setOutput('ref', `refs/pull/${pr.number}/merge`);
              core.setOutput('base', pr.base.sha);
              trusted = await verifyPullRequest({ github, owner, repo, number, publicKey: process.env.PUBLIC_KEY, workflow: '.github/workflows/release.yml', version, configPath: process.env.CONFIG_PATH });
            } else {
              core.setOutput('ref', context.sha);
              core.setOutput('base', '');
            }
            core.setOutput('trusted', String(trusted));
  checks:
    needs: route
    if: needs.route.outputs.trusted != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DuarteCaldeira/tooling
          ref: ${{ inputs.tooling-sha }}
          path: .tooling/source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Plan the entire PR diff
        env:
          BASE: ${{ needs.route.outputs.base }}
          CONFIG: ${{ inputs.config-path }}
        run: |
          args=(--all)
          if [ -n "$BASE" ]; then args=(--changed --base="$BASE" --committed); fi
          node .tooling/source/packages/tooling/runner/cli.mjs --profile=ci --config="$CONFIG" "${args[@]}" --plan > .tooling/plan.json
      - name: Inspect plan
        id: plan-info
        env:
          CONFIG: ${{ inputs.config-path }}
        run: node .tooling/source/packages/tooling/runner/ci-plan.mjs .tooling/plan.json
      - name: Select formatter installation
        id: install-plan
        if: inputs.lightweight-docs && steps.plan-info.outputs.active == 'true'
        run: node .tooling/source/packages/tooling/runner/docs-install.mjs .tooling/plan.json --plan
      - name: Install standalone formatter
        if: steps.plan-info.outputs.active == 'true' && steps.install-plan.outputs.lightweight == 'true'
        run: node .tooling/source/packages/tooling/runner/docs-install.mjs .tooling/plan.json
      - name: Install application dependencies
        if: steps.plan-info.outputs.active == 'true' && steps.install-plan.outputs.lightweight != 'true'
        run: npm ci --ignore-scripts
      - name: Restore tool caches
        if: steps.plan-info.outputs.active == 'true' && steps.install-plan.outputs.lightweight != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.plan-info.outputs.tool-cache-paths }}
          key: tooling-tools-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tooling-tools-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-
      - name: Provision selected prerequisites
        if: steps.plan-info.outputs.active == 'true'
        run: node .tooling/source/packages/tooling/runner/provision.mjs .tooling/plan.json
      - uses: actions/cache@v4
        if: steps.plan-info.outputs.browsers == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.plan-info.outputs.browser-key }}
      - name: Install matching browsers
        if: steps.plan-info.outputs.browsers == 'true'
        run: node .tooling/source/packages/tooling/runner/browsers.mjs .tooling/plan.json
      - name: Restore performance history
        if: steps.plan-info.outputs.active == 'true' && steps.plan-info.outputs.history == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tooling/history/runs.json
          key: tooling-history-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tooling-history-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-
      - name: Run shared check graph
        if: steps.plan-info.outputs.active == 'true'
        env:
          BASE: ${{ needs.route.outputs.base }}
          CONFIG: ${{ inputs.config-path }}
        run: |
          args=(--all)
          if [ -n "$BASE" ]; then args=(--changed --base="$BASE" --committed); fi
          node .tooling/source/packages/tooling/runner/cli.mjs --profile=ci --config="$CONFIG" "${args[@]}" --output=.tooling/report
      - name: Collect visual report
        if: always() && steps.plan-info.outputs.active == 'true'
        run: |
          if [ -f playwright-report/index.html ]; then
            node .tooling/source/packages/tooling/checks/visual-report.mjs
          elif [ -f frontend/playwright-report/index.html ]; then
            node .tooling/source/packages/tooling/checks/visual-report.mjs frontend/playwright-report
          fi
      - uses: actions/upload-artifact@v4
        id: validation-artifacts
        if: always() && steps.plan-info.outputs.active == 'true'
        with:
          name: validation-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .tooling/report/
            **/test-results/
            **/coverage/
          retention-days: 3
      - name: Publish validation summary
        if: always()
        env:
          TOOLING_ARTIFACT_URL: ${{ steps.validation-artifacts.outputs.artifact-url }}
          TOOLING_EMPTY_PLAN: ${{ steps.plan-info.outputs.active == 'false' }}
        run: node .tooling/source/packages/tooling/runner/summary.mjs .tooling/report
      - name: Save performance history
        if: always() && steps.plan-info.outputs.active == 'true' && steps.plan-info.outputs.history == 'true' && hashFiles('.tooling/history/runs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .tooling/history/runs.json
          key: tooling-history-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  result:
    name: result
    needs: [route, checks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete validation or a verified release
        env:
          ROUTE: ${{ needs.route.result }}
          TRUSTED: ${{ needs.route.outputs.trusted }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$ROUTE" = success
          test "$TRUSTED" = true || test "$CHECKS" = success
