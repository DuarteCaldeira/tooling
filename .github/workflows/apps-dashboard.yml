name: Refresh app dashboard
on:
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report automatic runtime refresh
        run: echo "Release data refreshes at runtime with a 60-second cache. No deployment is needed." >> "$GITHUB_STEP_SUMMARY"
