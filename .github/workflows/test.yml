name: Tooling tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install browser for accessibility integration
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Install dashboard dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix dashboard --ignore-scripts
      - name: Check mobile conversation panel
        if: runner.os == 'Linux'
        run: npm run test:dashboard:mobile
      - name: Check rendered accessibility
        if: runner.os == 'Linux'
        run: npm run test:browser
      - name: Check runtime release updates
        if: runner.os == 'Linux'
        run: npm run test:dashboard:runtime
      - run: npm run pack:tooling
